# Local dev stack for pompote-view (issue #5).
#
#   cp .env.example .env.local && docker compose --env-file .env.local up
#
# Services: Timescale → migrate (one-shot) → viz_api → frontend.
# Production images / K8s manifests are out of scope here (Lot 8, #28-#32).
name: pompote-view

services:
  # TimescaleDB (Apache build, consistent with the OVH instance).
  timescale:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # The timescaledb-ha image stores its cluster under /home/postgres/pgdata.
      - timescale_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: apply robot_rust's forward migrations, then create the read-only
  # role. robot_rust's schema is bind-mounted from a local checkout, never
  # committed here. Runs to completion, then viz_api starts.
  migrate:
    image: timescale/timescaledb-ha:pg16
    depends_on:
      timescale:
        condition: service_healthy
    environment:
      PGHOST: timescale
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      VIZ_READER_PASSWORD: ${VIZ_READER_PASSWORD}
    volumes:
      - ${ROBOT_RUST_PATH:-../robot_rust}/crates/robot_rust/migrations:/migrations:ro
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/migrate.sh"]
    restart: "no"

  # Read-only viz backend (axum + sqlx), built from ./backend.
  viz_api:
    build:
      context: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pompote_viz_reader:${VIZ_READER_PASSWORD}@timescale:5432/${POSTGRES_DB}
      VIZ_API_KEY: ${VIZ_API_KEY}
      VIZ_API_BIND_ADDR: 0.0.0.0:8080
      VIZ_DB_STATEMENT_TIMEOUT_MS: ${VIZ_DB_STATEMENT_TIMEOUT_MS:-5000}
      VIZ_ENABLE_SWAGGER_UI: ${VIZ_ENABLE_SWAGGER_UI:-false}
    ports:
      - "${VIZ_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # SvelteKit dev server (Vite). The API key stays server-side; the browser only
  # ever hits the SvelteKit proxy, which forwards to viz_api over the compose net.
  frontend:
    image: node:22-bookworm-slim
    depends_on:
      viz_api:
        condition: service_healthy
    working_dir: /app
    environment:
      BACKEND_URL: http://viz_api:8080
      VIZ_API_KEY: ${VIZ_API_KEY}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  timescale_data:
  frontend_node_modules:
