[package]
name = "application"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# Application crate: use cases + ports (traits implemented by adapters).
# MUST NOT depend on axum or sqlx. Allowed: domain, async-trait, thiserror,
# serde, chrono, tokio (for async primitives, no `full` feature here).

[dependencies]
domain.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
chrono.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true }
# Used in unit tests of the orders use case to build `Decimal::ZERO`
# placeholders without polluting the production dependency surface.
rust_decimal = { workspace = true }
# Used in backtest use-case tests to build a non-trivial `config_snapshot`
# `Value` (test-only; the domain already depends on serde_json for the entity).
serde_json = { workspace = true }
