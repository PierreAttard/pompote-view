[package]
name = "viz_api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# `viz_api` is the composition root (hexagonal "bootstrap" crate):
# it owns `fn main()`, reads the env config, builds the sqlx pool, wires
# the adapters into the application use cases, and starts the axum server.
# It contains no business logic.

[[bin]]
name = "viz_api"
path = "src/main.rs"

# Prints the OpenAPI spec as JSON (frontend codegen + CI freshness check).
[[bin]]
name = "dump_openapi"
path = "src/bin/dump_openapi.rs"

[dependencies]
application.workspace = true
adapters.workspace = true

axum.workspace = true
tokio.workspace = true
sqlx.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# Integration test harness deps (compiled only with `--features integration`,
# never in the default/offline build). See `tests/integration.rs`.
testcontainers = { version = "0.24", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Enables the DB-backed integration tests. Requires Docker (testcontainers)
# and `ROBOT_RUST_MIGRATIONS_DIR` pointing at a checkout of the robot_rust
# `crates/robot_rust/migrations` directory. Off by default so the standard
# offline CI (`SQLX_OFFLINE=true cargo test --workspace`) never needs a DB.
integration = ["dep:testcontainers", "dep:reqwest", "dep:serde_json"]
